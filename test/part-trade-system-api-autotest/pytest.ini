[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: 核心冒烟测试
    regression: 常规回归测试
    write: 会修改服务端数据的测试
    contract: 合同相关测试
    stream: 流式接口测试
log_cli = true
log_cli_level = INFO
log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
