$kind: http-example
request:
  url: "{{baseUrl}}/customers/addCustomer"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "id": 200001,
        "name": "顾客小明",
        "password": "1234",
        "phone": "13800138000",
        "address": "北京市海淀区中关村大街1号",
        "avatar": "https://part-trade.oss-cn-hangzhou.aliyuncs.com/avatar.jpg",
        "createTime": "2015-10-30T23:08:59.385Z",
        "updateTime": "2007-11-07T06:16:04.025Z"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
