$kind: http-request
description: 根据订单id删除订单
url: "{{baseUrl}}/orders/removeOrder/:orderId"
method: DELETE
headers:
  Accept: "*/*"
pathVariables:
  - key: orderId
    value: "1"
    description: 订单id
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/删除订单.resources/examples
order: 1000
