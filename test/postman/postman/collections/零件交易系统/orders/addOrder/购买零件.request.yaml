  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "id": 1,
      "merchantId": 100001,
      "customerId": 200001,
      "partId": 1,
      "amount": 10,
      "totalPrice": 500,
      "isSuccess": 0,
      "isPaid": 0,
      "createTime": "2019-08-08T03:21:12.484Z"
