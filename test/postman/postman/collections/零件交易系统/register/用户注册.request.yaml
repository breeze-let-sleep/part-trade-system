$kind: http-request
name: 用户注册
description: 用户注册，校验验证码通过后完成注册
url: "{{baseUrl}}/register"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "name": "顾客小米",
      "phone": "13800138000",
      "password": "1234",
      "role": 2,
      "code": "123456"
    }
settings: {}
examples: ./.resources/用户注册.resources/examples
order: 1000
