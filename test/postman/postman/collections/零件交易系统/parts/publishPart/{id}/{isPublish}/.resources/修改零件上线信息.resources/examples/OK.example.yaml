$kind: http-example
request:
  url: "{{baseUrl}}/parts/publishPart/:id/:isPublish"
  method: PUT
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "1"
      description: 商品id
    - key: isPublish
      value: "1"
      description: 是否发布上线（0:否;1:是）
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
