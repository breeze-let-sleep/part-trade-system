$kind: http-example
request:
  url: "{{baseUrl}}/merchants/likeMerchants?likeName=小明&likeAddress=海淀&startTime=2025-11-01 00:00:00&endTime=2025-11-30 23:59:59"
  method: GET
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: likeName
      value: 小明
      description: 模糊匹配的供应商名称
    - key: likeAddress
      value: 海淀
      description: 模糊匹配的供应商地址
    - key: startTime
      value: 2025-11-01 00:00:00
      description: 开始时间，格式：yyyy-MM-dd HH:mm:ss
    - key: endTime
      value: 2025-11-30 23:59:59
      description: 结束时间，格式：yyyy-MM-dd HH:mm:ss
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
