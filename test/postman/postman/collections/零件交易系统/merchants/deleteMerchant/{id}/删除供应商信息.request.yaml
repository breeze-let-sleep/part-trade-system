$kind: http-request
description: 根据id删除供应商信息
url: "{{baseUrl}}/merchants/deleteMerchant/:id"
method: DELETE
headers:
  Accept: "*/*"
pathVariables:
  - key: id
    value: "100001"
    description: 供应商的id
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/删除供应商信息.resources/examples
order: 1000
