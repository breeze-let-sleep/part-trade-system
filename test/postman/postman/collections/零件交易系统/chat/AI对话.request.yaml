$kind: http-request
description: 获取用户输入并通过流式返回ai响应结果
url: "{{baseUrl}}/chat?prompt=你好，请介绍一下零件交易流程&chatId=chat-1&curId=200001"
method: GET
headers:
  Accept: text/html;charset=utf-8
queryParams:
  - key: prompt
    value: 你好，请介绍一下零件交易流程
    description: 用户输入的问题
  - key: chatId
    value: chat-1
    description: 会话id
  - key: curId
    value: "200001"
    description: 当前用户id
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/AI对话.resources/examples
order: 1000
