$kind: http-example
request:
  url: "{{baseUrl}}/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "name": "小明",
        "phone": "13800138000",
        "password": "1234",
        "role": 2,
        "createTime": "2025-11-21 12:00:00",
        "updateTime": "2025-11-22 15:30:00",
        "code": "123456"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
