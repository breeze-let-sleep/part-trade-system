$kind: http-request
description: 用户登录，校验成功后返回JWT令牌
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "name": "顾客小明",
      "password": "1234",
      "role": 2
    }
scripts:
  - type: afterResponse
    code: |-
      // 1. 状态码校验
      pm.test("状态码为 200", function () {
          pm.response.to.have.status(200);
      });

      // 2. 响应时间校验
      pm.test("响应时间小于 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // 3. 响应体为 JSON 格式
      pm.test("响应体为 JSON 格式", function () {
          pm.response.to.be.json;
      });

      // 4. 响应体结构校验
      pm.test("响应体包含 code 字段", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("code");
      });
      pm.test("Status code is 1", function () {
          pm.response.to.have.status(1);
      });

      pm.test("响应体包含 data 字段", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("data");
      });

      // 5. 登录成功时校验 JWT token
      pm.test("登录成功时 data 中包含 token", function () {
          const json = pm.response.json();
          if (json.code === 1 || json.code === 1) {
              pm.expect(json.data).to.be.a("string").and.not.empty;
              // 将 token 保存到集合变量，供后续请求使用
              pm.collectionVariables.set("token", json.data);
          }
      });
    language: text/javascript
settings: {}
examples: ./.resources/用户登录.resources/examples
order: 1000
