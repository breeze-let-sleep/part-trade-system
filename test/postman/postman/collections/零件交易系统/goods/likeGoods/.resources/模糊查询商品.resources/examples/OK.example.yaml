$kind: http-example
request:
  url: "{{baseUrl}}/goods/likeGoods?inputMerchant=小明&inputPart=螺丝"
  method: GET
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: inputMerchant
      value: 小明
      description: 模糊匹配的供应商名称
    - key: inputPart
      value: 螺丝
      description: 模糊匹配的零件名称
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
