$kind: http-request
description: 模糊查询商品信息
url: "{{baseUrl}}/goods/likeGoods?inputMerchant=小明&inputPart=螺丝"
method: GET
headers:
  Accept: "*/*"
queryParams:
  - key: inputMerchant
    value: 小明
    description: 模糊匹配的供应商名称
  - key: inputPart
    value: 螺丝
    description: 模糊匹配的零件名称
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/模糊查询商品.resources/examples
order: 1000
