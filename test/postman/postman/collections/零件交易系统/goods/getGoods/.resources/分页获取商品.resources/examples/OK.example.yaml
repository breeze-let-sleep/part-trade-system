$kind: http-example
request:
  url: "{{baseUrl}}/goods/getGoods?cursor=0&size=10"
  method: GET
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: cursor
      value: "0"
      description: 游标：最后一条商品的id
    - key: size
      value: "10"
      description: 返回的记录数
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
