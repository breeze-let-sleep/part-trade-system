$kind: http-example
request:
  url: "{{baseUrl}}/contracts/signature?orderId=1&value=供应商小明"
  method: PUT
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: orderId
      value: "1"
      description: 订单id
    - key: value
      value: 供应商小明
      description: 签名值
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
