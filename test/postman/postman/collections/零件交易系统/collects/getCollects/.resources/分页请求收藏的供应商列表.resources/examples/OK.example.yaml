$kind: http-example
request:
  url: "{{baseUrl}}/collects/getCollects?currentPage=1&pageSize=10"
  method: GET
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: currentPage
      value: "1"
      description: 当前页
    - key: pageSize
      value: "10"
      description: 每页大小
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
