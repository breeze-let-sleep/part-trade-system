$kind: http-example
request:
  url: "{{baseUrl}}/collects/addCollect/:customerId/:merchantId"
  method: POST
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: customerId
      value: "200001"
      description: 顾客id，以2开头，共6位
    - key: merchantId
      value: "100001"
      description: 供应商id，以1开头，共6位
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
