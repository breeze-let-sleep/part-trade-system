$kind: http-example
request:
  url: "{{baseUrl}}/upload?file=string"
  method: POST
  headers:
    Accept: "*/*"
  queryParams:
    - key: file
      value: string
      description: 要上传的图片文件
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
