$kind: http-request
description: 根据id获取管理员详细信息
url: "{{baseUrl}}/admins/getInfo/:id"
method: GET
headers:
  Accept: "*/*"
pathVariables:
  - key: id
    value: "000001"
    description: 管理员的id
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/获取单个管理员信息.resources/examples
order: 1000
