$kind: http-request
description: 分页获取管理员详细信息列表
url: "{{baseUrl}}/admins/getAdmins?currentPage=1&pageSize=7"
method: GET
headers:
  Accept: "*/*"
queryParams:
  - key: currentPage
    value: "1"
    description: 当前页，默认为1
  - key: pageSize
    value: "7"
    description: 每页大小，默认为7
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/分页获取管理员列表.resources/examples
order: 1000
