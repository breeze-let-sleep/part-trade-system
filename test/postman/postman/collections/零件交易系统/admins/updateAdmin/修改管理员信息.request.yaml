$kind: http-request
description: 修改管理员信息，并返回修改后的管理员信息
url: "{{baseUrl}}/admins/updateAdmin"
method: PUT
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "id": 1,
      "name": "管理员小明",
      "password": "1234",
      "phone": "13800138000",
      "avatar": "https://part-trade.oss-cn-hangzhou.aliyuncs.com/avatar.jpg",
      "createTime": "1975-12-12T16:59:17.519Z",
      "updateTime": "2011-11-10T12:32:48.315Z"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/修改管理员信息.resources/examples
order: 1000
