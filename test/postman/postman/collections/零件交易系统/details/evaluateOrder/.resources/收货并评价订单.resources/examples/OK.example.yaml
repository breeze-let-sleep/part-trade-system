$kind: http-example
request:
  url: "{{baseUrl}}/details/evaluateOrder"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "id": 1,
        "orderId": 1,
        "isDeliver": 0,
        "isTake": 0,
        "star": 5,
        "evaluate": "物美价廉，物流很快",
        "updateTime": "1989-06-15T16:33:09.139Z"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "code": 1,
        "msg": "success",
        "data": {}
      }
order: 1000
