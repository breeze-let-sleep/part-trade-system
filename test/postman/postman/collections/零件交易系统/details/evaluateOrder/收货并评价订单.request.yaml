$kind: http-request
description: 确认收货并对订单进行星级评价
url: "{{baseUrl}}/details/evaluateOrder"
method: PUT
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "id": 1,
      "orderId": 1,
      "isDeliver": 0,
      "isTake": 0,
      "star": 5,
      "evaluate": "物美价廉，物流很快",
      "updateTime": "1989-06-15T16:33:09.139Z"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/收货并评价订单.resources/examples
order: 1000
